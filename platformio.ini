[platformio]
default_envs = bike
build_dir = .pio/build_user

[env]
platform       = espressif32
board          = adafruit_feather_esp32s3_nopsram
framework      = arduino
monitor_speed  = 115200

lib_deps =
    nanopb/Nanopb@^0.4.92
    https://github.com/arduino-libraries/MadgwickAHRS
    https://github.com/hideakitai/ArduinoEigen
    olikraus/U8g2@^2.35.19

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++2a
    -mtext-section-literals
    -Ilib/Core
    -Ilib/Drivers
    -Ilib/Model
    -Ilib/Bluetooth
    -Ilib/Storage
    -Ilib/Device
    -Ilib/Tracker

lib_ldf_mode = deep+

custom_nanopb_protos =
    +<./data/data.proto>


[env:bike]
build_flags =
    ${env.build_flags}
    -DDEVICE_BIKE

[env:car]
build_flags =
    ${env.build_flags}
    -DDEVICE_CAR

[env:adafruit_feather_esp32s3_nopsram]
build_flags =
    ${env.build_flags}
    -DDEVICE_BIKE
