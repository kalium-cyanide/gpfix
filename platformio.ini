[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps = 
    nanopb/Nanopb@^0.4.92
    electroniccats/MPU6050 @ ^1.3.0
    https://github.com/arduino-libraries/MadgwickAHRS
    https://github.com/koledickarlo/ESKF-ESP32
    https://github.com/PX4/eigen
    
build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++2a

custom_nanopb_protos = 
    +<./data/data.proto>