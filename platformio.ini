[platformio]
default_envs = bike

[env]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps = 
    nanopb/Nanopb@^0.4.92
    https://github.com/arduino-libraries/MadgwickAHRS
    https://github.com/hideakitai/ArduinoEigen

build_unflags = 
    -std=gnu++11

build_flags = 
    -std=gnu++2a
    -mtext-section-literals

custom_nanopb_protos = 
    +<./data/data.proto>


[env:bike]
build_flags = 
    ${env.build_flags}
    -DDEVICE_BIKE


[env:car]
build_flags = 
    ${env.build_flags}
    -DDEVICE_CAR

[env:adafruit_feather_esp32s3_nopsram]
build_flags = 
    ${env.build_flags}
    -DDEVICE_CAR
